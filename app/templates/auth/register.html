{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<style>
.auth-wrap{min-height:calc(100vh - 76px);display:flex;align-items:center;justify-content:center;padding:2rem 1rem;
  background:radial-gradient(ellipse at 60% 40%,rgba(0,212,255,.08) 0%,transparent 55%);}
.auth-box{width:100%;max-width:480px;}
.role-opt input{display:none;}
.role-opt label{border:1px solid var(--border);border-radius:10px;padding:.7rem;text-align:center;
                display:block;cursor:pointer;transition:all .2s;color:var(--muted);font-size:.82rem;}
.role-opt label i{display:block;font-size:1.3rem;margin-bottom:.3rem;}
.role-opt input:checked + label{border-color:var(--cyan);background:rgba(0,212,255,.07);color:var(--cyan);}
</style>
<div class="auth-wrap">
  <div class="auth-box">
    <div class="text-center mb-4">
      <h2 style="font-family:var(--font);font-weight:800;">Create your account</h2>
      <p style="color:var(--muted);font-size:.9rem;">Choose your role below to get started</p>
    </div>
    <div class="card">
      <div class="card-body p-4">
        <form method="POST" action="{{ url_for('auth.register') }}">
          <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" name="name" class="form-control" placeholder="Your full name" required/>
          </div>
          <div class="mb-3">
            <label class="form-label">Email Address</label>
            <input type="email" name="email" class="form-control" placeholder="you@example.com" required/>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" placeholder="Min 6 characters" required minlength="6"/>
          </div>
          <div class="mb-3">
            <label class="form-label">Register As</label>
            <div class="row g-2">
              <div class="col-4 role-opt">
                <input type="radio" name="role" value="student" id="r_student" checked/>
                <label for="r_student"><i class="fas fa-user-graduate"></i>Student</label>
              </div>
              <div class="col-4 role-opt">
                <input type="radio" name="role" value="university" id="r_uni"/>
                <label for="r_uni"><i class="fas fa-university"></i>University</label>
              </div>
              <div class="col-4 role-opt">
                <input type="radio" name="role" value="employer" id="r_emp"/>
                <label for="r_emp"><i class="fas fa-building"></i>Employer</label>
              </div>
            </div>
          </div>
          <div id="uni-extra" style="display:none">
            <div class="mb-3">
              <label class="form-label">Institution Name</label>
              <input type="text" name="institution_name" class="form-control" placeholder="e.g. IIT Hyderabad"/>
            </div>
          </div>
          <button type="submit" class="btn-cyan btn w-100 py-2 mt-1">Create Account</button>
        </form>
        <hr class="my-3"/>
        <p class="text-center mb-0" style="font-size:.85rem;color:var(--muted);">
          Already registered? <a href="{{ url_for('auth.login') }}" style="color:var(--cyan);">Sign in</a>
        </p>
      </div>
    </div>
  </div>
</div>
<script>
  document.querySelectorAll('input[name="role"]').forEach(r=>{
    r.addEventListener('change',()=>{
      document.getElementById('uni-extra').style.display=r.value==='university'?'block':'none';
    });
  });
</script>
{% endblock %}
